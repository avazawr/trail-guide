<form action="/admin/trails/{{ id }}" method="POST" class="adminForm">
  <label for="title">Title</label>
  <input type="text" id="title" name="title" value="{{ title }}" required />

  <label for="region_id">Region</label>
  <select id="region_id" name="region_id" required>
    {% for region in regions %} {% if region.id == region_id %}
    <option value="{{ region.id }}" selected>
      {{ region.name }}, {{ region.country }}
    </option>
    {% else %}
    <option value="{{ region.id }}">
      {{ region.name }}, {{ region.country }}
    </option>
    {% endif %} {% endfor %}
  </select>

  <label for="image_url">Image URL</label>
  <input type="url" id="image_url" name="image_url" value="{{ image_url }}" />

  <label for="difficulty">Difficulty</label>
  <select id="difficulty" name="difficulty" required>
    {% for value in ["easy", "moderate", "hard"] %} {% if difficulty == value %}
    <option value="{{ value }}" selected>{{ value }}</option>
    {% else %}
    <option value="{{ value }}">{{ value }}</option>
    {% endif %} {% endfor %}
  </select>

  <label for="distance_km">Distance (km)</label>
  <input
    type="number"
    id="distance_km"
    name="distance_km"
    value="{{ distance_km }}"
    min="0"
    step="0.1"
    required
  />

  <label for="description">Description</label>
  <textarea id="description" name="description" rows="6">
{{ description }}</textarea
  >

  <button type="submit">Save changes</button>
  <a href="/admin/trails" role="button" class="secondary outline">Cancel</a>
</form>
